    ssl_certificate /etc/letsencrypt/live/onaria.ai.kr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/onaria.ai.kr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
