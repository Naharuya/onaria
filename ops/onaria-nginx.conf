server {

    server_name onaria.ai.kr www.onaria.ai.kr;
    access_log /var/log/nginx/onaria/access.log onaria_minimal;
    error_log /var/log/nginx/onaria/error.log;

    # ONARIA web app: verified CI artifact, isolated from backend routes.
    location = /webapp { return 302 https://onaria.ai.kr/webapp/; }
    location ^~ /webapp/ {
        if ($host = www.onaria.ai.kr) { return 302 https://onaria.ai.kr$request_uri; }
        alias /opt/onaria/deployments/webapp/current/;
        index index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.onaria.ai.kr https://fonts.gstatic.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        location ~ (^|/)\. { return 404; }
        location ~ \.md$ { return 404; }
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/onaria.ai.kr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/onaria.ai.kr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {

    server_name api.onaria.ai.kr;
    access_log /var/log/nginx/onaria/access.log onaria_minimal;
    error_log /var/log/nginx/onaria/error.log;

