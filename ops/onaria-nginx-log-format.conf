# Install in nginx http context. No query string, request body or credentials.
log_format onaria_minimal '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent $request_time';
# ONARIA server blocks only:
# access_log /var/log/nginx/onaria/access.log onaria_minimal;
# error_log /var/log/nginx/onaria/error.log;
# Use the ONARIA-only logrotate rule; verify actual execution before
# publishing a retention promise. Keep administrator access audit separately.
