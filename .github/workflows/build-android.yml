name: App QA and Android Test APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: app-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ONARIA_AI_MODE: local
      ONARIA_EXTERNAL_API_DISABLED: 'true'
      OPENAI_API_KEY: ''
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run backend tests without live providers
        run: npm test

  build-apk:
    needs: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify data-preserving release installer
        run: node --test scripts/android-release.test.mjs

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.2
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch 3.47.2 "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Verify explicit legacy development override
        run: flutter test test/api_config_test.dart --dart-define=SOUL_BIBLE_API_BASE_URL=http://127.0.0.1:8787

      - name: Verify ONARIA override precedence
        run: flutter test test/api_config_test.dart --dart-define=SOUL_BIBLE_API_BASE_URL=http://127.0.0.1:8787 --dart-define=ONARIA_API_BASE_URL=https://staging.example.com

      # Only the root app is analyzed; RAMI is an independent Flutter project.
      - name: Analyze ONARIA lib, test and example
        run: flutter analyze lib test example --no-fatal-infos

      - name: Build test APK
        # No API override: APK/AAB/iOS use ApiConfig.productionBaseUrl.
        run: flutter build apk --debug

      - name: Build test AAB using the same API default
        run: flutter build appbundle --debug

      - name: Upload test AAB (not a store release)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: onaria-debug-aab
          path: build/app/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error

      - name: Upload test APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: onaria-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  buddhist-checkin:
    needs: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/buddhist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter 3.47.2
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch 3.47.2 "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
      - name: Verify Buddhist check-in, safety and card flow
        run: flutter test
      - run: flutter analyze lib test --no-fatal-infos
      - name: Compile unsigned Release for verification only
        # No signing credentials and no device installation or artifact publication.
        run: flutter build apk --release
      - name: Check Buddhist APK asset isolation
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('build/app/outputs/flutter-apk/app-release.apk') as apk:
              entries = apk.namelist()
          assert any(p.endswith('packages/onaria_buddhist_pack/assets/mock_scriptures.json') for p in entries)
          assert not any('bible' in p.lower() or 'system_prompt_ko' in p for p in entries)
          PY

  ios-compile:
    needs: backend-tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Flutter 3.47.2
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 --branch 3.47.2 "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: flutter pub get
      - name: Compile iOS simulator app without signing
        run: flutter build ios --simulator --debug --no-codesign
