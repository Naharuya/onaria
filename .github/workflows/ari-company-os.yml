name: ARI Company OS Engine
on:
  workflow_dispatch:
  push:
    branches: [automation/server-agent-platform-v0.1]
    paths: ['server/ari-company-os/**', '.github/workflows/ari-company-os.yml', '.ari/verification.yaml']
  pull_request:
    paths: ['server/ari-company-os/**', '.github/workflows/ari-company-os.yml', '.ari/verification.yaml']
permissions:
  contents: read
concurrency:
  group: ari-company-os-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  execution-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server/ari-company-os
    env:
      KSTOCK_LIVE_TRADING_ENABLED: 'false'
      KSTOCK_AI_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/ari-company-os/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Daemon integration without external providers
        run: node scripts/validate-installation.js > engine-fixture-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: ari-company-os-${{ github.sha }}
          path: server/ari-company-os/engine-fixture-result.json
          if-no-files-found: error
