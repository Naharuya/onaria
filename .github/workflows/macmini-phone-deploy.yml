name: Mac mini phone manual deploy

# Public repository: only trusted main may run on this private device runner.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onaria-macmini-phone-deploy
  cancel-in-progress: false

jobs:
  deploy-android-phone:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, onaria-deploy]
    timeout-minutes: 45
    env:
      ONARIA_AI_MODE: local
      ONARIA_EXTERNAL_API_DISABLED: 'true'
      OPENAI_API_KEY: ''
    steps:
      - name: Checkout trusted main source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          clean: true
          fetch-depth: 1
      - name: Configure local tools
        shell: bash
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$HOME/Library/Android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$HOME/Library/Android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/Library/Android/sdk" >> "$GITHUB_ENV"
          echo "JAVA_HOME=/Applications/Android Studio.app/Contents/jbr/Contents/Home" >> "$GITHUB_ENV"
      - name: Run Flutter regression tests
        run: flutter test
      - name: Analyze ONARIA app
        run: flutter analyze lib test example --no-fatal-infos
      - name: Prepare ignored local release configuration
        run: node scripts/prepare-local-release-config.mjs /Users/ari/ARI/projects/onaria
      - name: Verify safe release installer
        run: node --test scripts/android-release.test.mjs scripts/sync-naver-config.test.mjs scripts/prepare-local-release-config.test.mjs
      - name: Verify and install Release without deleting app data
        run: node scripts/android-release.mjs
      - name: Deployment summary
        if: always()
        run: |
          echo "ONARIA Release update result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Trusted main commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
