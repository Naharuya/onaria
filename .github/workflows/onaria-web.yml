name: ONARIA Web and Admin
on:
  workflow_dispatch:
  pull_request:
    paths: ['backend/**', 'packages/onaria_buddhist_pack/**', '.github/workflows/onaria-web.yml']
  push:
    branches: [main]
    paths: ['backend/**', 'packages/onaria_buddhist_pack/**', '.github/workflows/onaria-web.yml']
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      ONARIA_AI_MODE: local
      ONARIA_EXTERNAL_API_DISABLED: 'true'
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - name: Verify isolated Buddhist Mock UI
        run: npx playwright test --config dev/religion-packs/playwright.config.js
      - run: npm run test:web:performance
      - name: Package verified homepage files
        run: |
          mkdir -p ../build/homepage
          printf '%s\n' "$GITHUB_SHA" > ../build/homepage/SOURCE_COMMIT.txt
          sha256sum src/website.js src/website_content.js public/website/site.css > ../build/homepage/SHA256SUMS
          tar -czf ../build/homepage/onaria-homepage.tar.gz src/website.js src/website_content.js public/website/site.css
      - uses: actions/upload-artifact@v4
        with:
          name: onaria-homepage
          path: build/homepage/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onaria-web-results
          path: |
            build/onaria-web-results
            build/onaria-lighthouse
          if-no-files-found: ignore
