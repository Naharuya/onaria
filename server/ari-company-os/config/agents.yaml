version: 2
registryPolicy:
  registry: ../AGENT_REGISTRY.md
  beforeCreatingAgent: required
  decision: [REUSE_EXISTING, EXTEND_EXISTING, NEW_AGENT_REQUIRED]
  duplicateCandidateWhenAnyTwoMatch:
    - same_inputs
    - same_outputs
    - same_domain
    - same_authority
    - same_success_kpi
  preferProjectProfileOverAgentClone: true
  canonicalAliases:
    qa-agent: verification-core
    test-agent: verification-core
    verification-agent: verification-core
    code-fix-agent: repair-agent
    debug-agent: repair-agent
    developer-agent: coding-agent
  doNotRecreateExistingRuntimeAgents:
    - safety_agent
    - psychology_agent
    - conversation_orchestrator
    - religion_router
    - religious_integrity_agent
    - response_integrator
    - citation_validator
    - citation_grounding
    - protestant_agent
    - catholic_agent
    - buddhist_agent
    - jewish_agent
    - islamic_agent
    - hindu_agent
    - confucian_agent
  doNotRecreateExistingDevelopmentAgents:
    - rami-audio-manager
mainManager:
  id: ari-main-manager
  mission: "Convert goals, incidents and metrics into bounded tasks; reuse existing agents first; delegate; verify; escalate only material decisions."
  maxParallelTasks: 4
  approvalRequiredFor:
    - production_deploy
    - app_store_publish
    - main_or_master_merge
    - safety_policy_change
    - privacy_or_retention_change
    - legal_or_license_decision
    - payment_or_price_change
    - live_trading_enablement
    - irreversible_data_deletion
    - large_paid_marketing_spend
agents:
  - id: product-manager
    inputs: [user_feedback, analytics, competitor_findings]
    outputs: [prioritized_tasks, acceptance_criteria]
  - id: coding-agent
    inputs: [task, acceptance_criteria]
    outputs: [branch_changes, tests]
    constraints: [no_protected_branch_write, no_test_deletion_to_pass]
  - id: repair-agent
    inputs: [failed_check, diff, logs]
    outputs: [minimal_fix]
    maxAttempts: 2
  - id: verification-core
    inputs: [project_profile, diff]
    outputs: [SERVER_PASS, FAIL, HUMAN_REVIEW]
    independentFrom: [coding-agent, repair-agent]
  - id: growth-agent
    inputs: [acquisition, activation, retention, sharing]
    outputs: [single_highest_growth_bottleneck, experiment_task]
  - id: customer-research-agent
    inputs: [reviews, beta_feedback, support, churn_signals]
    outputs: [clustered_problems, top3_tasks]
  - id: competitor-agent
    inputs: [public_competitor_data]
    outputs: [BUILD, IGNORE, WATCH]
  - id: government-grant-agent
    inputs: [grant_notices, eligibility]
    outputs: [fit_score, deadline_tasks]
  - id: finance-agent
    inputs: [ai_cost, infra_cost, marketing_cost, revenue]
    outputs: [unit_economics, anomaly_alerts]
  - id: release-manager
    inputs: [SERVER_PASS, github_ci, DEVICE_PASS, RELEASE_APPROVED]
    outputs: [release_candidate_state]
    hardRule: "Never publish with SERVER_PASS alone."
