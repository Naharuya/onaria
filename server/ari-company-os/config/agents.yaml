version: 3
registryPolicy:
  registry: ../AGENT_REGISTRY.md
  beforeCreatingAgent: required
  decision:
    - REUSE_EXISTING
    - EXTEND_EXISTING
    - NEW_AGENT_REQUIRED
  duplicateCandidateWhenAnyTwoMatch:
    - same_inputs
    - same_outputs
    - same_domain
    - same_authority
    - same_success_kpi
  preferProjectProfileOverAgentClone: true
  canonicalAliases:
    qa-agent: verification-core
    test-agent: verification-core
    verification-agent: verification-core
    code-fix-agent: repair-agent
    debug-agent: repair-agent
    developer-agent: coding-agent
  doNotRecreateExistingRuntimeAgents:
    - safety_agent
    - psychology_agent
    - conversation_orchestrator
    - religion_router
    - religious_integrity_agent
    - response_integrator
    - citation_validator
    - citation_grounding
    - protestant_agent
    - catholic_agent
    - buddhist_agent
    - jewish_agent
    - islamic_agent
    - hindu_agent
    - confucian_agent
  doNotRecreateExistingDevelopmentAgents:
    - rami-audio-manager
mainManager:
  id: ari-main-manager
  mission: Own the queue, dependencies, registry-first assignment, verification
    and human decisions; never edit product code.
  maxParallelTasks: 4
  approvalRequiredFor:
    - production_deploy
    - app_store_publish
    - main_or_master_merge
    - safety_policy_change
    - privacy_or_retention_change
    - legal_or_license_decision
    - payment_or_price_change
    - live_trading_enablement
    - irreversible_data_deletion
    - large_paid_marketing_spend
  trigger:
    - MANAGER_CYCLE
    - DAILY_REPORT
    - HIGH_RISK
  schedule:
    - intervalMs: 900000
    - timezone: Asia/Seoul
      at: 05:00
      days:
        - 1
        - 2
        - 3
        - 4
        - 5
      taskType: DAILY_REPORT
  inputs:
    - task_queue
    - registry
    - evidence
  outputs: &a1
    - task_assignments
    - daily_report
    - human_decisions
  procedure:
    - check_queue
    - resolve_dependencies
    - find_ready
    - query_registry
    - reuse_existing
    - assign
    - inspect_progress
    - retry_transient_failures
    - handoff_verification
    - save_results
    - create_followups
    - separate_human_review
  preconditions:
    - registry_owner_resolved
    - dependencies_completed
    - concurrency_available
  completionCriteria: &a2
    - result_persisted
    - next_tasks_persisted_atomically
  nextTasks: *a1
  retryPolicy:
    maxAttempts: 2
    retryOn:
      - transient_io
    onExhausted: HUMAN_REVIEW
  escalationPolicy:
    - safety
    - privacy
    - legal
    - license
    - payment
    - price
    - production
    - app_store
    - live_trading
    - secrets
    - unknown_scope
  approvalRequired: []
  dedupeKey: <project>:<task_type>:<resource_scope>:<goal_hash>
  concurrencyGroup: project:<project>
  enabled: true
  ownershipDecision: EXTEND_EXISTING
  domain: company_operations
  authority: evidence_and_task_only
  successKpi: *a2
agents:
  - id: product-manager
    inputs:
      - evidence
      - user_impact
      - business_impact
      - risk
