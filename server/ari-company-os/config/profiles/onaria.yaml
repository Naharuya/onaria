project: onaria
protected_branches:
  - main
  - master
debounce_seconds: 1200
max_auto_repair_attempts: 2
checks:
  - id: git-diff-check
    command: git
    args:
      - diff
      - --check
    repairable: false
    stage: unit
  - id: backend-tests
    command: npm
    args:
      - test
    repairable: false
    cwd: backend
    humanReviewOnFail: true
    stage: unit
  - id: safety-regression
    command: node
    args:
      - --test
      - test/safety_invariants.test.js
    repairable: false
    cwd: backend
    humanReviewOnFail: true
    stage: risk
  - id: rag-smoke
    command: npm
    args:
      - run
      - eval:retrieval
    repairable: false
    cwd: backend
    humanReviewOnFail: true
    stage: smoke
  - id: flutter-test
    command: flutter
    args:
      - test
    repairable: false
    stage: unit
  - id: flutter-analyze
    command: flutter
    args:
      - analyze
    repairable: false
    stage: analyze
  - id: psychology-regression
    command: node
    args:
      - --test
      - test/orchestrator.test.js
      - test/local_orchestrator.test.js
    cwd: backend
    stage: risk
    repairable: false
    humanReviewOnFail: true
  - id: citation-bible-rag
    command: node
    args:
      - --test
      - test/knowledge_rag.test.js
    cwd: backend
    stage: risk
    repairable: false
    humanReviewOnFail: true
release_policy:
  server_pass_required: true
  github_ci_pass_required: true
  device_pass_required: true
  release_approved_required: true
  auto_merge: false
  auto_publish: false
build:
  command: flutter
  args:
    - build
    - apk
    - --debug
  artifact: build/app/outputs/flutter-apk/app-debug.apk
  automatic: true
repo: Naharuya/soul-bible
require_human_for:
  - safety_policy_change
  - privacy_policy_change
  - production_deploy
  - app_store_publish
coverage:
  required:
    - safety_crisis
    - downstream_zero
    - psychology
    - bible_rag
    - citation
    - backend
    - flutter_test
    - flutter_analyze
  checksByCapability:
    safety_crisis:
      - safety-regression
    downstream_zero:
      - safety-regression
    psychology:
      - psychology-regression
    bible_rag:
      - citation-bible-rag
    citation:
      - citation-bible-rag
    backend:
      - backend-tests
    flutter_test:
      - flutter-test
    flutter_analyze:
      - flutter-analyze
