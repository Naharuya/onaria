name: onaria
description: 감정 기반 AI 신앙 대화 onaria MVP 앱.
version: 0.4.2+8
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: 22.3.0
  flutter_svg: ^2.3.0
  flutter_timezone: ^5.1.0
  flutter_tts: ^4.2.5
  http: ^1.2.2
  kakao_flutter_sdk_user: ^2.0.1
  meta: ^1.15.0
  package_info_plus: ^10.2.2
  share_plus: ^13.3.0
  sign_in_with_apple: ^7.0.1
  shared_preferences: ^2.3.2
  speech_to_text: ^7.4.0
  timezone: ^0.11.1
  url_launcher: ^6.3.1
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^10.0.0
  naver_login_flutter: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.25.8
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/data/bible_verses_ko.json
    - assets/prompts/system_prompt_ko.txt
    - assets/images/
